<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redstone Puzzle - 讨论区</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f6f8fa;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        h1 {
            font-size: 26px;
            font-weight: 600;
            color: #24292f;
        }
        .subtitle {
            color: #57606a;
            font-size: 15px;
            margin-top: 6px;
            margin-bottom: 32px;
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 18px;
        }
        .subtitle a { color: #0969da; text-decoration: none; }
        .subtitle a:hover { text-decoration: underline; }
        @media (max-width: 600px) {
            .container { padding: 24px 16px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 Redstone Puzzle</h1>
        <div class="subtitle">
            欢迎在下方留言讨论 · 使用 <a href="https://github.com/xuzeng2/redstone-puzzle" target="_blank">GitHub</a> 账号登录
        </div>

        <!-- Giscus 评论区 -->
        <script src="https://giscus.app/client.js"
            data-repo="xuzeng2/redstone-puzzle"
            data-repo-id="R_kgDOTv610A"
            data-category="Announcements"
            data-category-id="DIC_kwDOTv610M4DC680"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="zh-CN"
            crossorigin="anonymous"
            async>
        </script>
    </div>
</body>
</html>
