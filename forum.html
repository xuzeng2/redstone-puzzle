<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redstone Puzzle - 讨论区</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f6f8fa;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        h1 {
            font-size: 26px;
            font-weight: 600;
            color: #24292f;
        }
        .subtitle {
            color: #57606a;
            font-size: 15px;
            margin-top: 6px;
            margin-bottom: 32px;
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 18px;
        }
        .subtitle a {
            color: #0969da;
            text-decoration: none;
        }
        .subtitle a:hover {
            text-decoration: underline;
        }

        /* ===== 警告框样式 ===== */
        .warning-box {
            background-color: #fff8e6;
            border-left: 4px solid #f0b400;
            padding: 14px 18px;
            border-radius: 6px;
            margin-bottom: 24px;
            font-size: 14px;
            color: #5c4a00;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .warning-box .icon {
            font-size: 18px;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .warning-box strong {
            color: #3d2f00;
        }
        .warning-box .emoji {
            font-style: normal;
        }

        /* ===== 页脚样式 ===== */
        .footer {
            margin-top: 48px;
            padding-top: 18px;
            border-top: 1px solid #d0d7de;
            font-size: 13px;
            color: #57606a;
            text-align: center;
        }
        .footer a {
            color: #0969da;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .container {
                padding: 24px 16px;
            }
            h1 {
                font-size: 20px;
            }
            .warning-box {
                font-size: 13px;
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 Redstone Puzzle</h1>
        <div class="subtitle">
            欢迎在下方留言讨论 · 使用 <a href="https://github.com/xuzeng2/redstone-puzzle" target="_blank">GitHub</a> 账号登录
        </div>

        <!-- ===== ⚠️ 警告框 ===== -->
        <div class="warning-box">
            <span class="icon">⚠️</span>
            <div>
                <strong>温馨提示：</strong>
                如果评论区加载失败（显示为空白或卡住），可能是chrome浏览器安全策略导致的。
                建议使用 <strong>其他浏览器</strong> 访问，或尝试
                <a href="chrome://flags/#block-insecure-private-network-requests" target="_blank" style="color:#0969da;text-decoration:underline;">chrome://flags/#block-insecure-private-network-requests</a>
                关闭Local Network Access Checks功能。
            </div>
        </div>

        <!-- ===== Giscus 评论区 ===== -->
        <script src="https://giscus.app/client.js"
            data-repo="xuzeng2/redstone-puzzle"
            data-repo-id="R_kgDOTv610A"
            data-category="Announcements"
            data-category-id="DIC_kwDOTv610M4DC680"
            data-mapping="url"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="zh-CN"
            data-avatar="https://giscus.app/avatar"
            crossorigin="anonymous"
            async>
        </script>

        <!-- ===== 页脚：MIT + 邮箱 ===== -->
        <div class="footer">
            MIT © 2026 ·
            <a href="mailto:3915266537@qq.com">3915266537@qq.com</a>
        </div>
    </div>
</body>
</html>
